# CI/CD for the Warehouse Digital Twin (Plan v2).
#   PR          -> data + web checks -> Vercel preview -> smoke test -> URL commented on the PR
#   push main   -> data + web checks -> Vercel production build (not yet live) -> smoke test -> promote
# A broken build or a failed smoke test never reaches the public URL.
#
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (ids are in .vercel/project.json after `vercel link`)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.10" # Plan v2 Section 2: Python 3.10+
  VERCEL_CLI: vercel@65.0.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  data:
    name: Data contract (Sections 3.1, 3.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: preprocess.py compiles
        run: |
          if [ -f preprocess.py ]; then python -m py_compile preprocess.py; else echo "::notice::preprocess.py not committed yet"; fi
      - name: Validate public/data JSON (schemas, train/test split, train-only top 100 and affinity)
        run: python scripts/validate_data.py public/data

  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest (simulation engine, Section 5.4)
        run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Vercel (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: [data, web]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "::notice::Fork PR - secrets unavailable, skipping preview deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets."; exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies and Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npm ci
          npm install -g "$VERCEL_CLI"

      - name: Pull project settings
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ "$TARGET" = production ]; then vercel build --prod --token="$VERCEL_TOKEN"; else vercel build --token="$VERCEL_TOKEN"; fi

      - name: Deploy prebuilt output
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # Production is deployed without the domain; it is promoted only after the smoke test.
          flags=()
          if [ "$TARGET" = production ]; then flags=(--prod --skip-domain); fi
          url=$(vercel deploy --prebuilt "${flags[@]}" --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TARGET: $url"

      - name: Smoke test (page + public/data served)
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          fetch() { vercel curl "$1" --deployment "$URL" --yes --token="$VERCEL_TOKEN"; }
          fetch / > index.html
          grep -q 'id="root"' index.html || { echo "::error::$URL/ did not return the app shell"; cat index.html | head -20; exit 1; }
          if [ -f public/data/products.json ]; then
            mkdir -p served
            for f in products orders affinity; do fetch "/data/$f.json" > "served/$f.json"; done
            python3 scripts/validate_data.py served
          fi

      - name: Promote to production
        if: steps.secrets.outputs.ok == 'true' && env.TARGET == 'production'
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"

      - name: Comment preview URL on PR
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.URL}\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)} passed data, lint, typecheck, Vitest and smoke checks.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
